<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>2damin 에디터</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;background:#111318;color:#e8e9ee}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:24px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:22px;font-weight:650;margin:0}p{margin:4px 0 20px;color:#a5acbb}a{color:#c9d7ef}small{color:#a5acbb}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start}.stage{background:#242830;display:flex;justify-content:center;height:min(73vh,850px);min-height:300px}canvas{height:100%;width:auto;max-width:100%;object-fit:contain;background:white}.references{display:grid;gap:18px}.references img{display:block;width:100%;max-height:27vh;object-fit:contain;background:white}figure{margin:0}figcaption{color:#a5acbb;font-size:13px;margin-top:5px}.controls{padding:18px 0}button,select{font:inherit;background:#262c36;border:1px solid #465064;color:#f1f4fa;border-radius:5px;padding:7px 13px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.primary{background:#d5e3fb;color:#14233a;border-color:#d5e3fb;min-width:85px}input[type=range]{width:100%;accent-color:#b6d3ff;margin:14px 0}output{font-variant-numeric:tabular-nums;min-width:185px}.status{font-size:13px;min-height:22px;color:#acb9ce}details{margin-top:10px}video{max-width:100%;height:55vh;display:block;margin:12px auto}label{display:inline-flex;align-items:center;gap:6px}@media(max-width:750px){main{padding:18px 14px}header{display:block}.layout{grid-template-columns:1fr}.references{grid-template-columns:1fr 1fr;gap:15px}.references img{max-height:180px}.stage{height:65vh}h1{font-size:19px}}
h2{font-size:18px;margin:0 0 10px}h3{font-size:14px;color:#c9d7ef;margin:0 0 10px}.face-panel{max-height:85vh;overflow:auto;padding-right:8px}.face-panel .box{border-top:1px solid #363d49;margin-top:14px;padding-top:12px}.face-panel label.range{display:grid;grid-template-columns:65px 1fr;width:100%;font-size:13px}.range input[type=range]{margin:9px 0}.visemes{display:flex;gap:5px;flex-wrap:wrap}.visemes button{padding:4px 9px}.speech-buttons{display:flex;gap:6px;flex-wrap:wrap}.speech-buttons button{padding:6px 10px}.dialogue{font-size:14px;color:#ddd;margin-bottom:12px}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick button{font-size:13px;padding:7px 10px}.credit{display:block;margin-top:15px;font-size:11px}.references{display:flex;gap:20px}.references img{max-width:40%;max-height:300px}.face-panel small{font-size:12px;display:block;margin-top:7px}@media(max-width:750px){.face-panel{max-height:none;overflow:visible}.layout{grid-template-columns:1fr}}
</style></head><body><main>
<header><div><h1>2damin 에디터</h1><p>Flow 동작 위에 눈·입을 따로 움직여 표정과 대사를 만듭니다.</p></div><small id="meta">영상 정보 불러오는 중</small></header>
<div class="layout"><section><div class="stage"><canvas id="canvas" aria-label="Flow 추출 프레임 애니메이션"></canvas></div><div class="controls"><div class="row"><button class="primary" id="play" disabled>재생</button><button id="prev" disabled aria-label="이전 프레임">←</button><button id="next" disabled aria-label="다음 프레임">→</button><output id="position">0.00초</output><label>방향 <select id="direction"><option value="forward">정방향 →</option><option value="reverse">역방향 ←</option><option value="pingpong" selected>정방향 ↔ 역방향</option></select></label><label>속도 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label><input type="checkbox" id="loop" checked>반복</label></div><input id="seek" type="range" min="0" value="0" step="1" disabled aria-label="프레임 탐색"><div class="status" id="status" role="status">준비 중…</div><small>Space 재생/정지 · ← → 한 프레임 이동</small></div></section><aside class="face-panel"><h2>표정과 말하기</h2><label><input id="faceOn" type="checkbox" checked> 눈·입 직접 조절</label><div class="quick"><button id="blink" class="primary">눈 깜빡이기 · B</button><button id="speakMove" class="primary">동작 + 대사 재생</button></div><small>동작 배속과 무관하게 대사·입·눈은 독립 작동</small>
<div class="box"><h3>눈</h3><label class="range">왼쪽 눈 <input id="eyeL" type="range" min="0" max="1" step=".01" value="1"></label><label class="range">오른쪽 눈 <input id="eyeR" type="range" min="0" max="1" step=".01" value="1"></label><label class="range">시선 <input id="gaze" type="range" min="-1" max="1" step=".01" value="0"></label><label><input id="autoBlink" type="checkbox"> 자동 깜빡임</label></div>
<div class="box"><h3>입</h3><div class="visemes"><button data-viseme="REST">닫기</button><button data-viseme="A">아</button><button data-viseme="E">에</button><button data-viseme="I">이</button><button data-viseme="O">오</button><button data-viseme="U">우</button></div><label class="range">벌리기 <input id="mouth" type="range" min="0" max="1" step=".01" value="0"></label><label class="range">너비 <input id="mouthWidth" type="range" min=".5" max="1.4" step=".01" value="1"></label><label class="range">둥글게 <input id="round" type="range" min="0" max="1" step=".01" value="0"></label></div>
<div class="box"><h3>대사</h3><p class="dialogue">대사를 준비해 주세요.</p><div class="speech-buttons"><button id="speak">대사 말하기</button><button id="stopSpeech">말 멈추기</button></div><small id="speechState">Typecast 음성</small><div>현재 발음 <strong id="syllable">수동</strong></div><audio id="speech" preload="auto" src="audio/dialogue.wav"></audio><small>음성은 정속으로 재생됩니다.</small></div><button id="faceReset">표정 초기화</button><small class="credit">이 콘텐츠의 목소리는 <a href="https://typecast.ai/kr" target="_blank" rel="noopener">타입캐스트</a>로 만들었어요.</small></aside></div>
<details><summary>시작·끝 원화 보기</summary><div class="references"><img src="assets/start.jpg" alt="시작 원화"><img src="assets/end.jpg" alt="끝 원화"></div></details><details id="original"><summary>생성 원본 영상 비교</summary><video controls preload="none" src="video/flow-original.mp4" playsinline></video></details>
</main><script type="module" src="player.js"></script></body></html>
